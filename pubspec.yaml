name: ready_my_cv_workspace
description: Ready My CV workspace.
publish_to: none
environment:
  sdk: ^3.8.1

workspace:
  - apps/web
  - packages/core_models
  - packages/catalog_models
  - packages/scoring_engine
  - packages/agent_engine
  - packages/pdf_parser_contract
  - packages/server_analysis_runner
  - packages/validation
  - packages/design_system
  - packages/test_fixtures

dev_dependencies:
  build_runner: ^2.4.15
dependencies:
  agent_engine:
    path: packages/agent_engine
  catalog_models:
    path: packages/catalog_models
  core_models:
    path: packages/core_models
  pdf_parser_contract:
    path: packages/pdf_parser_contract
