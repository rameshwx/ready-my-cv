name: Build image
on: {push: {branches: [main]}}
permissions: {contents: read, packages: write}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: ready_my_cv}
        ports: ['5432:5432']
        options: --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/ready_my_cv'
      SESSION_HASH_PEPPER: 'ci-only-pepper-value-at-least-32-characters'
      ADMIN_INITIAL_PASSWORD: 'ci-only-initial-password'
      PUBLIC_ORIGIN: 'http://localhost:8080'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {flutter-version: '3.32.2', channel: stable, cache: true}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: api/package-lock.json}
      - run: dart pub get
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/core_models
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/catalog_models
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: packages/pdf_parser_contract
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/web
      - run: flutter analyze && flutter test
        working-directory: apps/web
      - run: flutter build web --release --no-source-maps
        working-directory: apps/web
      - name: Assert browser-only web shell
        run: |
          test ! -e apps/web/web/manifest.json
          test ! -e apps/web/build/web/manifest.json
          ! rg -n -i 'rel="manifest"|mobile-web-app-capable|apple-mobile-web-app|apple-touch-icon' apps/web/web/index.html apps/web/build/web/index.html
      - run: npm ci && npm run typecheck && npm run build && npm test && npm run db:migrate && npm run db:seed
        working-directory: api
      - run: dart run evaluation/bin/run_agents.dart && dart run evaluation/bin/compare_results.dart
      - run: docker build --tag ready-my-cv:ci .
  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: 'ghcr.io/rameshwx/ready-my-cv:${{ github.sha }}'}
